# Update dependencies, commit them and create a new tag
name: Update dependencies

on:
  schedule:
    - cron: '30 6 * * *' # every day at 06:30 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Update dependencies
        run: yarn upgrade

      - name: Commit files
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected, nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # echo "Changes detected, running building and testing."
          # yarn build
          # yarn test --ci --silent

          echo "Committing changes."
          git config user.name "github-actions[bot]"
          git config user.email "{user.id}+{user.login}[bot]@users.noreply.github.com"
          npm version patch --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add -A
          git commit -m "chore: version v$VERSION" --no-verify
          git tag "v$VERSION"
          git push --atomic origin main "v$VERSION"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Trigger publish-to-npm workflow
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish-to-npm.yml
